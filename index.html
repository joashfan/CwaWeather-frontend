<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NIGHT_CITY_WEATHER // 連線中</title>
    <link rel="icon" type="image/png" href="./icon-v2.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        /* === 系統變數定義 === */
        :root {
            --neon-cyan: #00f3ff;      /* 主要數據、邊框 */
            --neon-pink: #ff0099;      /* 警告、強調 */
            --neon-yellow: #fcee0a;    /* 標示 */
            --bg-dark: #050510;        /* 深色底 */
            --glass-bg: rgba(0, 0, 0, 0.7); /* 半透明玻璃 */
            --glass-border: rgba(0, 243, 255, 0.3);
            --font-title: 'Orbitron', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none; /* 隱藏系統游標，使用自定義光標 */
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-mono);
            background-color: var(--bg-dark);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            transition: background-image 1s ease-in-out;
        }

        /* 黑色遮罩，讓文字在複雜背景上更清楚 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6); /* 背景壓暗 */
            z-index: -1;
            pointer-events: none;
        }

        /* CRT 掃描線特效 */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            z-index: 900;
            pointer-events: none;
            animation: scanlineMove 10s linear infinite;
            opacity: 0.6;
        }

        @keyframes scanlineMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }

        /* === 自定義霓虹游標 === */
        .cursor-dot,
        .cursor-outline {
            position: fixed;
            top: 0;
            left: 0;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 9999;
            pointer-events: none;
        }

        .cursor-dot {
            width: 8px;
            height: 8px;
            background-color: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .cursor-outline {
            width: 40px;
            height: 40px;
            border: 1px solid var(--neon-cyan);
            transition: width 0.2s, height 0.2s, top 0.1s, left 0.1s;
        }

        /* 頂部狀態列 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid var(--neon-cyan);
            position: sticky;
            top: 0;
            z-index: 100;
            font-family: var(--font-title);
            letter-spacing: 1px;
        }

        .location-pill {
            color: var(--neon-cyan);
            font-weight: 900;
            text-shadow: 0 0 5px var(--neon-cyan);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .location-pill::before {
            content: '[LOC]';
            font-size: 0.7em;
            color: var(--neon-pink);
        }

        .update-pill {
            font-size: 0.8rem;
            color: var(--neon-yellow);
            background: rgba(252, 238, 10, 0.1);
            padding: 4px 10px;
            border: 1px solid var(--neon-yellow);
            border-radius: 2px;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        /* === 核心：今日焦點卡片 (Glassmorphism + Hologram) === */
        .hero-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px; /* 改為方角一點 */
            padding: 30px 25px;
            text-align: center;
            margin-bottom: 35px;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
            
            /* 3D 視差準備 */
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        /* 卡片四角的裝飾線 */
        .hero-card::after {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--neon-cyan), transparent 20%, transparent 80%, var(--neon-pink));
            z-index: -1;
            border-radius: 12px;
            opacity: 0.5;
        }

        .hero-period {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: var(--neon-cyan);
            padding: 2px 15px;
            font-family: var(--font-title);
            font-size: 0.8rem;
            border: 1px solid var(--neon-cyan);
            letter-spacing: 2px;
        }

        .hero-temp-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
            transform: translateZ(20px); /* 3D 浮凸效果 */
        }

        .hero-icon {
            font-size: 5rem;
            /* 霓虹濾鏡 */
            filter: drop-shadow(0 0 10px var(--neon-cyan)); 
            animation: glitch 3s infinite alternate;
        }

        @keyframes glitch {
            0% { transform: skew(0deg); opacity: 1; }
            95% { transform: skew(0deg); opacity: 1; }
            96% { transform: skew(-10deg); opacity: 0.8; filter: hue-rotate(90deg); }
            97% { transform: skew(10deg); opacity: 1; }
            98% { transform: skew(0deg); opacity: 1; }
            100% { transform: skew(0deg); opacity: 1; }
        }

        .hero-temp {
            font-size: 5rem;
            font-weight: 900;
            color: #fff;
            line-height: 1;
            font-family: var(--font-title);
            text-shadow: 4px 4px 0px rgba(0, 243, 255, 0.3);
        }

        .hero-desc {
            font-size: 1.8rem;
            color: var(--neon-yellow);
            margin-bottom: 25px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transform: translateZ(10px);
        }

        /* === 數據網格 === */
        .advice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed var(--glass-border);
            transform: translateZ(10px);
        }

        .advice-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .advice-icon {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: var(--neon-cyan);
        }

        .advice-text {
            font-size: 1rem;
            font-weight: 400;
            color: #ddd;
            margin: 5px 0;
            line-height: 1.2;
        }

        .advice-sub {
            font-size: 0.7rem; 
            color: var(--neon-pink);
            font-family: var(--font-title);
        }

        /* === 橫向滑動區 === */
        .section-title {
            font-family: var(--font-title);
            font-size: 1rem;
            color: var(--neon-cyan);
            margin-bottom: 15px;
            margin-left: 5px;
            text-transform: uppercase;
            border-left: 3px solid var(--neon-pink);
            padding-left: 10px;
        }

        .scroll-container {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding-bottom: 10px;
            scrollbar-width: none;
        }

        .scroll-container::-webkit-scrollbar {
            display: none;
        }

        .mini-card {
            min-width: 130px;
            background: var(--glass-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            text-align: center;
            flex-shrink: 0;
            transition: all 0.3s;
        }
        
        .mini-card:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            transform: translateY(-5px);
        }

        .mini-time {
            background: rgba(255, 0, 153, 0.2);
            color: var(--neon-pink);
            padding: 2px 8px;
            font-size: 0.7rem;
            display: inline-block;
            margin-bottom: 10px;
            border: 1px solid var(--neon-pink);
        }

        .mini-icon {
            font-size: 2rem;
            margin: 5px 0;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.5));
        }

        .mini-temp {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }

        /* Loading 畫面 */
        .loading-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        
        .loader-text {
            color: var(--neon-cyan);
            font-family: var(--font-title);
            margin-top: 20px;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

    </style>
</head>

<body>
    <div class="scanlines"></div>
    
    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-outline" id="cursor-outline"></div>

    <div id="loading" class="loading-screen">
        <div style="font-size: 4rem; filter: drop-shadow(0 0 10px var(--neon-cyan));">📡</div>
        <p class="loader-text">CONNECTING TO SATELLITE...</p>
        <p style="color: var(--neon-pink); font-size: 0.8rem; margin-top:5px;">同步率: <span id="syncRate">0</span>%</p>
    </div>

    <div class="status-bar">
        <div class="location-pill">TAIPEI_CITY</div>
        <div id="updateTime" class="update-pill">SYNCING...</div>
    </div>

    <div class="container" id="mainContent" style="display: none;">

        <div id="heroCardContainer">
            </div>

        <h3 class="section-title">FUTURE_LOGS // 預報序列</h3>
        <div class="scroll-container" id="futureForecasts">
        </div>

    </div>

    <script>
        const API_URL = "https://weather-joash.zeabur.app/api/weather/kaohsiung";
        
        // --- 游標追蹤特效 ---
        const cursorDot = document.getElementById("cursor-dot");
        const cursorOutline = document.getElementById("cursor-outline");

        window.addEventListener("mousemove", function (e) {
            const posX = e.clientX;
            const posY = e.clientY;

            // 圓點直接跟隨
            cursorDot.style.left = `${posX}px`;
            cursorDot.style.top = `${posY}px`;

            // 圓圈延遲跟隨 (增加一點拖曳感)
            cursorOutline.animate({
                left: `${posX}px`,
                top: `${posY}px`
            }, { duration: 500, fill: "forwards" });
        });

        // --- 天氣圖示對應 (可以換成 FontAwesome，這裡先用 Emoji 加上霓虹濾鏡) ---
        function getWeatherIcon(weather) {
            if (!weather) return "📡";
            if (weather.includes("晴")) return "☀️";
            if (weather.includes("多雲")) return "🌥️";
            if (weather.includes("陰")) return "☁️";
            if (weather.includes("雨")) return "🌧️";
            if (weather.includes("雷")) return "⛈️";
            return "🌤️";
        }

        // --- 背景邏輯：Cyberpunk 規則 ---
        // 規則：
        // 1. 晚上 (18:00 - 06:00) -> bg1 (固定)
        // 2. 早上 (06:00 - 18:00) 
        //    - 晴天 -> bg3
        //    - 雨天 -> bg2
        //    - 陰天/其他 -> bg1 (使用者指定)
        function setBackground(weatherText) {
            const hour = new Date().getHours();
            const isNight = hour >= 18 || hour < 6;
            let bgImage = 'bg1.png'; // 預設

            if (isNight) {
                bgImage = 'bg1.png';
            } else {
                // 白天邏輯
                if (weatherText.includes("雨")) {
                    bgImage = 'bg2.png';
                } else if (weatherText.includes("晴") && !weatherText.includes("多雲")) {
                    bgImage = 'bg3.png';
                } else {
                    // 陰天或多雲，依照要求使用 Cyber City
                    bgImage = 'bg1.png'; 
                }
            }
            
            document.body.style.backgroundImage = `url('${bgImage}')`;
        }

        // --- 文案產生器：Cyberpunk 風格 ---
        function getCyberpunkAdvice(rainProb, maxTemp) {
            let rainIcon = "🛡️";
            let rainText = "護盾待機中";
            let rainSub = "降雨機率 LOW";
            
            if (parseInt(rainProb) > 30) {
                rainIcon = "☂️";
                rainText = "酸雨警告";
                rainSub = "建議裝備：防水力場";
            }

            let clothIcon = "🧥";
            let clothText = "熱調節：正常";
            let clothSub = "系統運作穩定";

            const temp = parseInt(maxTemp);
            if (temp >= 28) {
                clothIcon = "🎽";
                clothText = "散熱模組啟動";
                clothSub = "警告：環境過熱";
            } else if (temp <= 20) {
                clothIcon = "🧥";
                clothText = "核心保溫模式";
                clothSub = "偵測到低溫異常";
            }

            return { rainIcon, rainText, rainSub, clothIcon, clothText, clothSub };
        }

        function getTimePeriod(startTime) {
            const hour = new Date(startTime).getHours();
            // 用比較科技感的時段命名
            if (hour >= 5 && hour < 11) return "CYCLE_MORNING";
            if (hour >= 11 && hour < 14) return "CYCLE_NOON";
            if (hour >= 14 && hour < 18) return "CYCLE_AFTERNOON";
            if (hour >= 18 && hour < 23) return "CYCLE_NIGHT";
            return "CYCLE_MIDNIGHT";
        }

        function renderWeather(data) {
            const forecasts = data.forecasts;
            const current = forecasts[0];
            const others = forecasts.slice(1);

            // 設定背景
            setBackground(current.weather);

            // 1. 渲染 Hero Card
            const advice = getCyberpunkAdvice(current.rain, current.maxTemp);
            const period = getTimePeriod(current.startTime);
            const avgTemp = Math.round((parseInt(current.maxTemp) + parseInt(current.minTemp)) / 2);

            const heroHtml = `
                <div class="hero-card" id="tiltCard">
                    <div class="hero-period">${period}</div>
                    <div class="hero-temp-container">
                        <div class="hero-icon">${getWeatherIcon(current.weather)}</div>
                        <div class="hero-temp">${avgTemp}<span style="font-size:2rem">°C</span></div>
                    </div>
                    <div class="hero-desc">${current.weather}</div>
                    
                    <div class="advice-grid">
                        <div class="advice-item">
                            <div class="advice-icon">${advice.rainIcon}</div>
                            <div class="advice-text">${advice.rainText}</div>
                            <div class="advice-sub">${advice.rainSub} [${current.rain}%]</div>
                        </div>
                        <div class="advice-item">
                            <div class="advice-icon">${advice.clothIcon}</div>
                            <div class="advice-text">${advice.clothText}</div>
                            <div class="advice-sub">${advice.clothSub} [Max ${current.maxTemp}°]</div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('heroCardContainer').innerHTML = heroHtml;

            // 加入視差滾動 (Parallax Tilt) 效果
            const card = document.getElementById('tiltCard');
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = ((y - centerY) / centerY) * -10; // 上下翻轉
                const rotateY = ((x - centerX) / centerX) * 10;  // 左右翻轉

                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)`;
            });

            // 2. 渲染稍後預報
            const scrollContainer = document.getElementById('futureForecasts');
            scrollContainer.innerHTML = '';
            const todayDate = new Date().getDate();

            others.forEach(f => {
                let p = getTimePeriod(f.startTime).replace('CYCLE_', '');
                const fDate = new Date(f.startTime);
                if (fDate.getDate() !== todayDate) {
                    p = "NEXT_DAY // " + p;
                }

                scrollContainer.innerHTML += `
                    <div class="mini-card">
                        <div class="mini-time">${p}</div>
                        <div class="mini-icon">${getWeatherIcon(f.weather)}</div>
                        <div class="mini-temp">${f.minTemp}° - ${f.maxTemp}°</div>
                        <div style="font-size:0.7rem; color:var(--neon-cyan); margin-top:5px; font-family:var(--font-mono);">H2O: ${f.rain}%</div>
                    </div>
                `;
            });

            // 3. 更新時間
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0]; // YYYY-MM-DD
            document.getElementById('updateTime').textContent = `LAST_UPDATED: ${dateStr}`;
        }

        async function fetchWeather() {
            try {
                // 模擬讀取進度條
                let percent = 0;
                const syncRateEl = document.getElementById('syncRate');
                const loadingInterval = setInterval(() => {
                    percent += Math.floor(Math.random() * 10);
                    if (percent > 99) percent = 99;
                    syncRateEl.innerText = percent;
                }, 100);

                const fetchPromise = fetch(API_URL).then(res => res.json());
                // 等待至少 1.5 秒讓 Loading 特效跑一下
                const delayPromise = new Promise(resolve => setTimeout(resolve, 1500));

                const [_, json] = await Promise.all([delayPromise, fetchPromise]);

                clearInterval(loadingInterval);
                syncRateEl.innerText = "100";

                if (json.success) {
                    renderWeather(json.data);
                    // 切換顯示
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                } else {
                    throw new Error("API Error");
                }
            } catch (e) {
                console.error(e);
                document.querySelector('.loader-text').innerText = "CONNECTION FAILED // 系統連線異常";
                document.querySelector('.loader-text').style.color = "var(--neon-pink)";
            }
        }

        document.addEventListener("DOMContentLoaded", fetchWeather);
    </script>
</body>

</html>
